<!doctype html>
<html lang="en">
  <head>

    <title>Form Layout Horizontal</title>

              <label for="upassword" class="form-label">password</label>
            </div>

            </div>
            <div class="col-md-5">
              <input type="password" id="upassword" class="form-control" />
            </div>

          <div class="row mb-2">
