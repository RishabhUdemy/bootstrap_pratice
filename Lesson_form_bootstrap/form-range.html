<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <form action="">
            <h3>Range</h3>

            <div class="mb-3">
              <label for="custome_range" class="form-label">Range</label>
              <input
                type="range"
                name=""
                id="custome_range"
                class="form-range"
              />
            </div>

            <div class="mb-3">
              <label for="custome_ran">MinMaxRange</label>
              <input
                type="range"
                id="custome_ran"
                class="form-range"
                min="0"
                max="5"
              />
            </div>

            <div class="mb-3">
              <label for="custome_ran">Step Range</label>
              <input
                type="range"
                id="custome_ran"
                class="form-range"
                step="0.5"
                min="0"
                max="5"
              />
            </div>
          </form>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
