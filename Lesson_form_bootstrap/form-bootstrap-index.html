<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h2>Basic Form Login</h2>

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <form action="*">
            <fieldset>
              <legend>Login Basic Form</legend>
              <div class="mb-3">
                <label class="form-lable" for="u_name">UserName</label>
                <input class="form-control" type="text" id="u_name" required />
              </div>

              <div class="mb-3">
                <label class="form-label" for="u_pass">Password</label>
                <input
                  class="form-control"
                  type="password"
                  name=""
                  id="u_pass"
                  required
                />
              </div>

              <button class="btn btn-success">Login</button>
            </fieldset>
          </form>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
