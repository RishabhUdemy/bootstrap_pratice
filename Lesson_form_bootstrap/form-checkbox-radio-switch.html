<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>bootstrap Checkbox and more</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-3">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <form action="#">
            <div class="form-check">
              <input
                type="checkbox"
                id="default_checkbox"
                class="form-check-input"
                value="checked"
              />

              <label for="default_checkbox" class="form-label"
                >Default Checkbox
              </label>
            </div>

            <div class="form-check">
              <input
                type="checkbox"
                id="defaultcheckbox"
                class="form-check-input"
                checked
                value="checked"
              />
              <label for="defaultcheckbox" class="form-label"
                >Checked Default</label
              >
            </div>

            <div class="form-check">
              <input
                type="checkbox"
                id="defaultcheckbox"
                class="form-check-input"
                checked
                disabled
                value="checked"
              />
              <label for="defaultcheckbox" class="form-label"
                >Checked Default</label
              >
            </div>

            <div class="form-check">
              <input
                type="checkbox"
                id="defaultcheckbox"
                class="form-check-input"
                checked
                value="checked"
              />
              <label for="defaultcheckbox" class="form-label"
                >Checked Default</label
              >
            </div>

            <div class="form-check">
              <input
                type="checkbox"
                name=""
                id="defaultcheckbox1"
                class="form-check-input"
              />
              <label for="defaultcheckbox1">indeterminate</label>
            </div>

            <div class="form-check">
              <input
                type="radio"
                name=""
                id="formradio"
                class="form-check-input"
              />
              <label for="formradio" class="formradio">Male</label>
            </div>

            <div class="form-check form-switch">
              <input
                type="checkbox"
                name=""
                id="formswitch"
                role="switch"
                class="form-check-input"
                checked
              />
              <label for="formswitch">Default Switch</label>
            </div>

            <h3>Horizontal Checkbox</h3>
            <div class="form-check form-check-inline">
              <input
                type="checkbox"
                name=""
                id="horizontalcheckbox"
                class="form-check-input"
              />
              <label for="horizontalcheckbox" class="form-label">Label1</label>
            </div>
            <div class="form-check form-check-inline">
              <input
                type="checkbox"
                name=""
                id="horizontalcheckbox"
                class="form-check-input"
              />
              <label for="horizontalcheckbox" class="form-label">Label2</label>
            </div>
            <div class="form-check form-check-inline">
              <input
                type="checkbox"
                name=""
                id="horizontalcheckbox"
                class="form-check-input"
              />
              <label for="horizontalcheckbox" class="form-label">Label3</label>
            </div>
          </form>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <script>
      var interm = (document.getElementById("defaultcheckbox1").indeterminate =
        true);
    </script>
  </body>
</html>
