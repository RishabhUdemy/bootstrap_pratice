<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Layout Vertical Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <div class="container mt-3">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="row">
            <div class="col-md-6">
              <label for="firstname" class="form-label">Firstname</label>
              <input type="text" name="" id="firstname" class="form-control" />
            </div>
            <div class="col-md-6">
              <label for="lastname" class="form-label">Lastname</label>
              <input type="text" name="" id="lastname" class="form-control" />
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <label for="u_email" class="form-label">Email Id</label>
              <input
                type="eamil"
                name=""
                id="u_email"
                class="form-control"
                required
              />
            </div>
            <div class="col-md-6">
              <label for="u_phone" class="form-label">Phone</label>
              <input type="tel" name="" id="u_phone" class="form-control" />
            </div>
          </div>

          <div class="row">
            <div class="col-md-12">
              <label for="address" class="form-label">Address</label>
              <textarea
                name=""
                id="address"
                class="form-control"
                rows="5"
              ></textarea>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-6">
              <label for="city" class="form-label">City</label>
              <input type="text" class="form-control" id="city" />
            </div>
            <div class="col-md-4">
              <label for="state" class="form-label">State</label>
              <select name="" id="state" class="form-select">
                <option>Select City</option>
                <option value="Delhi">Delhi</option>
                <option value="Raipur">Raipur</option>
              </select>
            </div>
            <div class="col-md-2">
              <label for="pin" class="form-label">Pin</label>
              <input type="text" name="" id="pin" class="form-control" />
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-12">
              <div class="form-check">
                <input
                  type="checkbox"
                  name=""
                  id="u_check"
                  class="form-check-input"
                />
                <label for="u_check" class="form-check-label">
                  check me out
                </label>
              </div>
            </div>
          </div>

          <div class="row mb-3">
            <div class="col-md-12">
              <input type="submit" value="SignUp" class="btn btn-success" />
            </div>
          </div>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
