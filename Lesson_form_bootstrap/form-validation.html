<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Form Validation</title>
  </head>
  <body>
    <div class="container">
      <div class="row align-item-center jusitfy-cotent-center mt-3">
        <div class="col-md-4">
          <form action="" name="myForm" onsubmit="return validMe()">
            <div class="mb-2">
              <label for="uname" class="form-label">Username</label>
              <input
                type="text"
                id="uname"
                name="uname"
                class="form-control form-control-sm"
              />
            </div>

            <div class="mb-2">
              <label for="upass" class="form-label">Password</label>
              <input
                type="password"
                id="upass"
                name="upass"
                class="form-control form-control-sm"
              />
            </div>

            <button class="btn btn-primary btn-sm" name="u_login">Login</button>
          </form>
        </div>
      </div>
    </div>

    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script>
      var uname1 = document.myForm.uname;
      var upass1 = document.myForm.upass;
      function validMe() {
        var isUnameValid = uname1.value.trim() !== "";
        var isUpassValid = upass1.value.trim() !== "";
        uname1.classList.toggle("is-invalid", !isUnameValid);
        uname1.classList.toggle("is-valid", isUnameValid);
        upass1.classList.toggle("is-invalid", !isUpassValid);
        upass1.classList.toggle("is-valid", isUpassValid);
        return false;
      }
    </script>
  </body>
</html>
