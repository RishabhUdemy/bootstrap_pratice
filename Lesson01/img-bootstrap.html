<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <title>Image bootstrap</title>
  </head>
  <body>
    <div class="container">
      <div class="row">
        <div class="col-md-4">
          <!-- img-fluid main purpose of it width is 100% and height is auto -->
          <img
            class="img-fluid float-md-end"
            src="../img/hero.png"
            alt="Website OmniFood"
          />
        </div>
      </div>
    </div>

    <!-- img-thumbnail is for the border line in the image -->
    <div class="container mt-5 mb-5">
      <div class="row">
        <div class="col-12 flex-nowrap justify-content-between d-flex">
          <img
            class="img-fluid"
            style="width: 300px"
            src="../img/images (1).jpg"
            alt="OmniFood"
          />
          <img
            class="img-fluid"
            style="width: 300px"
            src="../img/images (1).jpg"
            alt="OmniFood"
          />
          <img
            class="img-fluid"
            style="width: 300px"
            src="../img/images (1).jpg"
            alt="OmniFood"
          />
        </div>
      </div>
    </div>
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
